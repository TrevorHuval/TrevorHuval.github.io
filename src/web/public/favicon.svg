<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="TH">
  <!-- A single frame on a strip of film: the same contact-sheet idea the site's
       date stamps come from, cut down until it still reads at 16px. -->
  <rect width="32" height="32" rx="7" fill="#22252c"/>
  <g fill="#ffffff" opacity="0.34">
    <rect x="4" y="7" width="3" height="3" rx="1"/>
    <rect x="4" y="14.5" width="3" height="3" rx="1"/>
    <rect x="4" y="22" width="3" height="3" rx="1"/>
    <rect x="25" y="7" width="3" height="3" rx="1"/>
    <rect x="25" y="14.5" width="3" height="3" rx="1"/>
    <rect x="25" y="22" width="3" height="3" rx="1"/>
  </g>
  <rect x="10" y="8" width="12" height="16" rx="2" fill="#c9702f"/>
</svg>
